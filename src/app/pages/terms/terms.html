<div class="max-w-3xl mx-auto px-4 sm:px-6 py-12 sm:py-20 flex flex-col gap-10">

  <header class="flex flex-col gap-4">
    <h1 class="text-3xl sm:text-4xl font-bold">{{ page().title }}</h1>
    <p class="text-base sm:text-lg">{{ page().intro }}</p>
  </header>

  <section class="flex flex-col gap-8">
    @for (section of page().sections; track $index) {
      <div class="flex flex-col gap-3">
        <h2 class="text-xl sm:text-2xl font-bold">{{ section.heading }}</h2>
        <p>{{ section.text }}</p>
        @if (section.items.length) {
          <ul class="list-disc pl-5 flex flex-col gap-1">
            @for (item of section.items; track item) {
              <li>{{ item }}</li>
            }
          </ul>
        }
        @if (section.textAfter) {
          <p>{{ section.textAfter }}</p>
        }
      </div>
    }
  </section>

</div>

<section class="w-full py-12 sm:py-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8 sm:mb-12">
      <h2 class="text-2xl sm:text-3xl font-bold">{{ lang.dict().portfolioSection.title }}</h2>
      <a routerLink="/portfolio" class="underline">{{ lang.dict().portfolioSection.viewAll }}</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      @for (project of content.featuredProjects(); track project.slug) {
        <article class="flex flex-col border rounded-lg overflow-hidden card-hover">
          <a [routerLink]="['/portfolio', project.slug]" class="w-full aspect-video overflow-hidden img-hover-zoom">
            @if (project.imageUrl) {
              <img [src]="project.imageUrl" [alt]="project.name" class="w-full h-full object-cover" />
            }
          </a>
          <div class="flex flex-col gap-2 p-5">
            <h3 class="text-xl font-semibold">{{ project.name }}</h3>
            <p class="text-sm">{{ project.shortDescription }}</p>
          </div>
        </article>
      }
    </div>

  </div>
</section>

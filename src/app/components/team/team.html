<section class="w-full py-12 sm:py-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col gap-10 sm:gap-16">

    <!-- Stats row -->
    <div class="grid grid-cols-3 gap-4 sm:gap-8">
      @for (stat of lang.dict().teamSection.stats; track stat.value) {
        <div class="flex flex-col gap-1">
          <strong class="text-2xl sm:text-4xl font-bold">{{ stat.value }}</strong>
          <span class="text-sm sm:text-base">{{ stat.label }}</span>
        </div>
      }
    </div>

    <!-- Group photo -->
    <div class="w-full aspect-[3/2] overflow-hidden shadow-lg">
      <img src="/team/team.jpg" alt="Company team" class="w-full h-full object-cover" />
    </div>

    <!-- Team grid -->
    <div>
      <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-10">{{ lang.dict().teamSection.title }}</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 sm:gap-8">
        @for (member of lang.dict().teamSection.members; track member.role) {
          <div class="flex flex-col gap-3">
            <div class="w-full aspect-[2/3] overflow-hidden shadow-lg">
              <img [src]="member.photo" [alt]="member.name" class="w-full h-full object-cover" />
            </div>
            <h3 class="font-semibold">{{ member.name }}</h3>
            <p class="text-sm">{{ member.role }}</p>
          </div>
        }
      </div>
    </div>

    <a routerLink="/about" class="border px-6 py-3 w-fit">{{ lang.dict().teamSection.moreCta }}</a>

  </div>
</section>

<section class="w-full py-12 sm:py-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <h2 appReveal class="text-2xl sm:text-3xl font-bold mb-8 sm:mb-12">{{ lang.dict().servicesSection.title }}</h2>

    <div appRevealGroup class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      @for (service of content.services(); track service.slug) {
        <article class="flex flex-col border rounded-lg overflow-hidden card-hover">
          <a [routerLink]="['/services', service.slug]" class="w-full aspect-video overflow-hidden img-hover-zoom">
            @if (service.imageUrl) {
              <img [src]="service.imageUrl" [alt]="service.name" loading="lazy" decoding="async"
                   class="w-full h-full object-cover" />
            }
          </a>
          <div class="flex flex-col flex-1 gap-2 p-5">
            <h3 class="text-xl font-semibold">{{ service.name }}</h3>
            <p>{{ service.summary }}</p>
            <a [routerLink]="['/services', service.slug]" class="mt-auto link-arrow link-arrow--forward">{{ lang.dict().servicesSection.learnMore }}</a>
          </div>
        </article>
      } @empty {
        @if (content.isLoading()) {
          @for (i of [1, 2, 3]; track i) {
            <div class="skeleton-card" aria-hidden="true">
              <div class="aspect-video skeleton"></div>
              <div class="flex flex-col gap-3 p-5">
                <span class="skeleton" style="width:60%;height:1.4rem"></span>
                <span class="skeleton" style="width:90%;height:0.9rem"></span>
                <span class="skeleton" style="width:40%;height:0.9rem"></span>
              </div>
            </div>
          }
        }
      }
    </div>

  </div>
</section>

<section class="w-full py-12 sm:py-20">
  <div class="max-w-4xl mx-auto px-4 sm:px-6">

    <h2 appReveal class="text-2xl sm:text-3xl font-bold mb-8 sm:mb-12">{{ lang.dict().process.title }}</h2>

    <ol appRevealGroup class="process-track list-none">
      @for (step of lang.dict().process.steps; track step.number) {
        <li class="process-step">
          <span class="process-step__badge">{{ step.number }}</span>
          <p class="process-step__text">{{ step.text }}</p>
        </li>
      }
    </ol>

  </div>
</section>

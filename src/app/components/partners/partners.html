<section appReveal="fade" class="w-full py-12 border-y">
  <div class="partners-marquee">
    <ul class="partners-track list-none">
      @for (partner of content.partners(); track partner.name + partner.logoUrl) {
        <li class="partners-item">
          <img [src]="partner.logoUrl" [alt]="partner.name" loading="lazy" decoding="async" />
        </li>
      } @empty {
        @if (content.isLoading()) {
          @for (i of [1, 2, 3, 4, 5, 6]; track i) {
            <li class="partners-item" aria-hidden="true"><span class="skeleton" style="width:100%;height:100%"></span></li>
          }
        }
      }
    </ul>
    <ul class="partners-track list-none" aria-hidden="true">
      @for (partner of content.partners(); track partner.name + partner.logoUrl) {
        <li class="partners-item">
          <img [src]="partner.logoUrl" alt="" loading="lazy" decoding="async" />
        </li>
      }
    </ul>
  </div>
</section>

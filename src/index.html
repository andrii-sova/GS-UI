<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Галіція Сталь</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Apply saved lang before first paint to avoid flash -->
  <script>
    (function () {
      var l = localStorage.getItem('gs-lang');
      if (l === 'uk' || l === 'en') {
        document.documentElement.setAttribute('lang', l);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

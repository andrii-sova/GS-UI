<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Галіція Сталь</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#0b1822">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=cyrillic,latin">
  <!-- Apply saved lang before first paint to avoid flash -->
  <script>
    (function () {
      var l = localStorage.getItem('gs-lang');
      if (l === 'uk' || l === 'en') {
        document.documentElement.setAttribute('lang', l);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
